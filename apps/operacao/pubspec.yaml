name: operacao
description: RodaJusta — app das lojas e dos entregadores.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  rodajusta_core:
    path: ../../packages/core
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.0.0
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/marca.png
